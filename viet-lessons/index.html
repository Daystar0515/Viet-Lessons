  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-root="" data-page="home">
<main>

  <div class="home-hero">
    <h1><span class="vi">Xin chào!</span> 越來越好</h1>
    <p>給台灣人的越南語入門講義。每一課都用同樣的六個區塊：情境對話、單字表、文法重點、文化小知識、小測驗，讓你每次都知道該往哪裡看。</p>
  </div>

  <section>
    <h2><span class="num">課</span>課程列表</h2>
    <div id="lesson-grid" class="lesson-grid"></div>
  </section>

  <section>
    <h2><span class="num">?</span>怎麼使用這份講義</h2>
    <div class="info-box">
      <ul class="goals">
        <li>先看 <a href="tones.html">聲調表</a>：越南語有六個聲調，每個單字旁的彩色標籤就是它的聲調。</li>
        <li>按下越南文旁邊的 🔊 可以聽發音（需要裝置有越南語語音，iPhone 與多數 Android 手機都有）。</li>
        <li>本講義以北部（河內）音為準，南部說法不同時會寫在單字表的「備註」欄。</li>
        <li>每課最後有 5 題小測驗，點選答案就會顯示解析。</li>
      </ul>
    </div>
  </section>

</main>
